[pytest]
# Pytest Configuration for Medaudit 2.0

# Test discovery
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Minimum Python version
minversion = 3.8

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Markers for organizing tests
markers =
    unit: Unit tests for individual components
    integration: Integration tests (HL7 server, proxy, etc.)
    slow: Tests that take a long time to run
    pcap: Tests that use PCAP files
    pii: PII detection tests

# Coverage options (if pytest-cov is installed)
# addopts = --cov=medaudit --cov-report=html

# Timeout for tests (requires pytest-timeout)
# timeout = 30

# Doctest options
doctest_optionflags = NORMALIZE_WHITESPACE ELLIPSIS
