# medaudit2 fuzzing config targeting the demo hospital.
# Load in the Fuzzer tab, or run:
#   python -m medaudit.fuzzer run -c demo/hospital-sim/attacks/fuzz-hospital.yaml
# (localhost target -> no --i-am-authorized needed)

name: "St. Elsewhere HL7 interface fuzz"
target_host: "localhost"
target_port: 2575
use_tls: false
delay_ms: 25
timeout_seconds: 5
max_requests: 500
stop_on_error: false

base_message: |
  MSH|^~\&|EPIC|STELSEWHERE|MEDAUDIT|PENTEST|{timestamp}||ADT^A01|{msg_id}|P|2.5
  PID|1||200500||Doe^John||19850101|M|||||||||||123-45-6789

rules:
  # SQL injection into the MRN (PID-3) -> error-based SQLi findings (AE ACKs)
  - name: "SQLi in MRN"
    target: field
    segment: PID
    field_index: 3
    strategy: sql
    iterations: 20

  # Oversized patient name (PID-5) -> connection drop / crash findings
  - name: "Overflow patient name"
    target: field
    segment: PID
    field_index: 5
    strategy: overflow
    iterations: 10

  # Special/format/unicode across the name field -> parser robustness
  - name: "Malformed name field"
    target: field
    segment: PID
    field_index: 5
    strategy: all
    iterations: 1

  # Delimiter mutation on the whole message -> protocol robustness
  - name: "Delimiter mutation"
    target: message
    strategy: delimiter
