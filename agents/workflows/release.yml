# =============================================================================
# Build Burp extension and create GitHub Release
# Triggered on version tags (v*)
# =============================================================================

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-burp-extension:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Burp extension JAR
        working-directory: burp-extension
        run: gradle jar

      - name: Upload Burp extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: burp-extension
          path: burp-extension/build/libs/medaudit2-burp-extension-*.jar

  create-release:
    needs: build-burp-extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Burp extension artifact
        uses: actions/download-artifact@v4
        with:
          name: burp-extension
          path: release-assets/

      - name: Package platform source
        run: |
          # Create a clean source archive excluding dev/runtime files
          git archive --format=tar.gz --prefix=medaudit2/ HEAD -o release-assets/medaudit2-${{ github.ref_name }}.tar.gz
          git archive --format=zip --prefix=medaudit2/ HEAD -o release-assets/medaudit2-${{ github.ref_name }}.zip

      - name: List release assets
        run: ls -la release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Medaudit 2.0 - ${{ github.ref_name }}"
          body: |
            ## Medaudit 2.0 - Medical Device Security Audit Platform

            ### Downloads

            | Asset | Description |
            |-------|-------------|
            | `medaudit2-${{ github.ref_name }}.tar.gz` | Platform source (tar.gz) |
            | `medaudit2-${{ github.ref_name }}.zip` | Platform source (zip) |
            | `medaudit2-burp-extension-1.0.0.jar` | Burp Suite extension |

            ### Quick Start

            ```bash
            # Extract and install
            tar xzf medaudit2-${{ github.ref_name }}.tar.gz
            cd medaudit2
            pip install -r requirements.txt
            python -m spacy download en_core_web_lg

            # Start the web UI
            python -m medaudit web --generate-password
            ```

            ### Docker

            ```bash
            docker pull anirudhduggal/medaudit:latest
            docker run -p 8080:8080 anirudhduggal/medaudit
            ```

            ### Burp Extension

            1. Download `medaudit2-burp-extension-1.0.0.jar`
            2. In Burp Suite: **Extensions > Add > Java > select JAR**
            3. Configure the Medaudit proxy host/port in the **Medaudit2** tab

            See [README](https://github.com/anirudhduggal/medaudit2#readme) for full documentation.
          files: release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
