<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - Medaudit 2.0</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1e40af;
            --success: #16a34a;
        }
        
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        
        .auth-container {
            width: 100%;
            max-width: 480px;
            padding: 2rem;
        }
        
        .auth-card {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 20px;
            padding: 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        
        .header {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .header-icon {
            font-size: 3rem;
            background: linear-gradient(135deg, #f59e0b, #f97316);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1e293b;
            margin-top: 0.5rem;
        }
        
        .header p {
            color: #64748b;
            font-size: 0.9rem;
            margin-bottom: 0;
        }
        
        .form-floating {
            margin-bottom: 1rem;
        }
        
        .form-floating input {
            border-radius: 12px;
            border: 2px solid #e2e8f0;
            padding: 1rem;
            height: auto;
        }
        
        .form-floating input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            border: none;
            border-radius: 12px;
            padding: 0.875rem;
            font-weight: 600;
            width: 100%;
            transition: all 0.3s;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(37, 99, 235, 0.3);
        }
        
        .alert {
            border-radius: 12px;
            border: none;
        }
        
        .password-requirements {
            font-size: 0.875rem;
            color: #64748b;
            margin-top: 0.5rem;
            padding-top: 0.5rem;
            border-top: 1px solid #e2e8f0;
        }
        
        .requirement-item {
            display: flex;
            align-items: center;
            padding: 0.25rem 0;
        }
        
        .requirement-icon {
            display: inline-block;
            width: 20px;
            margin-right: 0.75rem;
            text-align: center;
        }
        
        .requirement-icon.met {
            color: var(--success);
        }
        
        .requirement-icon.unmet {
            color: #cbd5e1;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="header">
                <div class="header-icon"><i class="bi bi-shield-exclamation"></i></div>
                <h1>Change Password</h1>
                <p>First-time setup required</p>
            </div>
            
            <div id="alertContainer"></div>
            
            <form id="changePasswordForm">
                <div class="form-floating">
                    <input type="password" class="form-control" id="currentPassword" placeholder="Current Password" required>
                    <label for="currentPassword"><i class="bi bi-lock me-2"></i>Current Password</label>
                </div>
                
                <div class="form-floating">
                    <input type="password" class="form-control" id="newPassword" placeholder="New Password" required minlength="8">
                    <label for="newPassword"><i class="bi bi-lock me-2"></i>New Password</label>
                </div>
                
                <div class="form-floating">
                    <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm New Password" required minlength="8">
                    <label for="confirmPassword"><i class="bi bi-lock-fill me-2"></i>Confirm New Password</label>
                </div>
                
                <div class="password-requirements">
                    <div class="requirement-item">
                        <span class="requirement-icon unmet" id="lengthIcon"><i class="bi bi-circle-fill"></i></span>
                        <span>At least 8 characters</span>
                    </div>
                    <div class="requirement-item">
                        <span class="requirement-icon unmet" id="matchIcon"><i class="bi bi-circle-fill"></i></span>
                        <span>Passwords match</span>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary mt-4" id="submitBtn">
                    <span class="btn-text">Update Password & Continue</span>
                    <span class="spinner-border spinner-border-sm d-none" role="status"></span>
                </button>
            </form>
            
            <div class="text-center mt-4">
                <small class="text-muted">
                    <i class="bi bi-info-circle me-1"></i>
                    For security, you must change the default password before accessing the system.
                </small>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const newPasswordInput = document.getElementById('newPassword');
        const confirmPasswordInput = document.getElementById('confirmPassword');
        const lengthIcon = document.getElementById('lengthIcon');
        const matchIcon = document.getElementById('matchIcon');
        
        function validatePassword() {
            const newPassword = newPasswordInput.value;
            const confirmPassword = confirmPasswordInput.value;
            
            // Check length
            if (newPassword.length >= 8) {
                lengthIcon.classList.remove('unmet');
                lengthIcon.classList.add('met');
            } else {
                lengthIcon.classList.remove('met');
                lengthIcon.classList.add('unmet');
            }
            
            // Check match
            if (newPassword && confirmPassword && newPassword === confirmPassword) {
                matchIcon.classList.remove('unmet');
                matchIcon.classList.add('met');
            } else {
                matchIcon.classList.remove('met');
                matchIcon.classList.add('unmet');
            }
        }
        
        newPasswordInput.addEventListener('input', validatePassword);
        confirmPasswordInput.addEventListener('input', validatePassword);
        
        document.getElementById('changePasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const btnText = submitBtn.querySelector('.btn-text');
            const spinner = submitBtn.querySelector('.spinner-border');
            const alertContainer = document.getElementById('alertContainer');
            
            const currentPassword = document.getElementById('currentPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            // Clear previous alerts
            alertContainer.innerHTML = '';
            
            // Validate passwords match
            if (newPassword !== confirmPassword) {
                alertContainer.innerHTML = '<div class="alert alert-danger"><i class="bi bi-exclamation-triangle me-2"></i>Passwords do not match</div>';
                return;
            }
            
            // Validate password length
            if (newPassword.length < 8) {
                alertContainer.innerHTML = '<div class="alert alert-danger"><i class="bi bi-exclamation-triangle me-2"></i>Password must be at least 8 characters</div>';
                return;
            }
            
            // Show loading
            btnText.textContent = 'Updating password...';
            spinner.classList.remove('d-none');
            submitBtn.disabled = true;
            
            try {
                const response = await fetch('/auth/change-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        current_password: currentPassword,
                        new_password: newPassword
                    })
                });
                
                const data = await response.json();
                
                if (response.ok && data.success) {
                    // Show success and redirect
                    alertContainer.innerHTML = '<div class="alert alert-success"><i class="bi bi-check-circle me-2"></i>Password changed successfully! Redirecting...</div>';
                    setTimeout(() => {
                        window.location.replace('/dashboard');
                    }, 1500);
                } else {
                    throw new Error(data.detail || 'Failed to change password');
                }
            } catch (error) {
                alertContainer.innerHTML = `<div class="alert alert-danger"><i class="bi bi-exclamation-triangle me-2"></i>${error.message || 'An error occurred'}</div>`;
                btnText.textContent = 'Update Password & Continue';
                spinner.classList.add('d-none');
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
