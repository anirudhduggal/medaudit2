<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medaudit 2.0 - Login / Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1e40af;
        }
        
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        
        .auth-container {
            width: 100%;
            max-width: 480px;
            padding: 2rem;
        }
        
        .auth-card {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 20px;
            padding: 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        
        .brand {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .brand-icon {
            font-size: 3rem;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .brand h1 {
            font-size: 1.75rem;
            font-weight: 700;
            color: #1e293b;
            margin-top: 0.5rem;
        }
        
        .brand p {
            color: #64748b;
            font-size: 0.9rem;
        }
        
        /* Tabs */
        .nav-tabs {
            border-bottom: 2px solid #e2e8f0;
            margin-bottom: 1.5rem;
        }
        
        .nav-tabs .nav-link {
            color: #64748b;
            border: none;
            padding: 0.75rem 1.5rem;
            font-weight: 500;
            transition: all 0.3s ease;
            border-bottom: 2px solid transparent;
        }
        
        .nav-tabs .nav-link:hover {
            color: var(--primary);
            border-color: transparent;
        }
        
        .nav-tabs .nav-link.active {
            color: var(--primary);
            border-bottom: 2px solid var(--primary);
            background: transparent;
        }
        
        .form-floating {
            margin-bottom: 1rem;
        }
        
        .form-floating input {
            border-radius: 12px;
            border: 2px solid #e2e8f0;
            padding: 1rem;
            height: auto;
        }
        
        .form-floating input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            border: none;
            border-radius: 12px;
            padding: 0.875rem;
            font-weight: 600;
            width: 100%;
            transition: all 0.3s;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(37, 99, 235, 0.3);
        }
        
        .alert {
            border-radius: 12px;
            border: none;
        }
        
        .password-requirements {
            font-size: 0.875rem;
            color: #64748b;
            margin-top: 0.5rem;
        }
        
        .default-admin-hint {
            text-align: center;
            margin-top: 1rem;
            padding: 0.75rem;
            background: #f1f5f9;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="brand">
                <div class="brand-icon"><i class="bi bi-shield-check"></i></div>
                <h1>Medaudit 2.0</h1>
                <p>Medical Device Security Platform</p>
            </div>
            
            <!-- Tabs -->
            <ul class="nav nav-tabs" id="authTabs" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="login-tab" data-bs-toggle="tab" data-bs-target="#login" type="button" role="tab" aria-controls="login" aria-selected="true">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Login
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="register-tab" data-bs-toggle="tab" data-bs-target="#register" type="button" role="tab" aria-controls="register" aria-selected="false">
                        <i class="bi bi-person-plus me-1"></i> Register
                    </button>
                </li>
            </ul>

            <!-- Tab Content -->
            <div class="tab-content" id="authTabContent">
                <!-- Login Tab -->
                <div class="tab-pane fade show active" id="login" role="tabpanel" aria-labelledby="login-tab">
                    <div id="login-alert" class="alert alert-danger d-none" role="alert">
                        <i class="bi bi-exclamation-triangle me-2"></i>
                        <span id="login-error-message"></span>
                    </div>
                    
                    <form id="loginForm">
                        <div class="form-floating">
                            <input type="text" class="form-control" id="login-username" placeholder="Username" required>
                            <label for="login-username"><i class="bi bi-person me-2"></i>Username or Email</label>
                        </div>
                        
                        <div class="form-floating">
                            <input type="password" class="form-control" id="login-password" placeholder="Password" required>
                            <label for="login-password"><i class="bi bi-lock me-2"></i>Password</label>
                        </div>
                        
                        <button type="submit" class="btn btn-primary mt-3" id="loginBtn">
                            <span class="btn-text">Sign In</span>
                            <span class="spinner-border spinner-border-sm d-none" role="status"></span>
                        </button>
                    </form>
                    
                    <div class="default-admin-hint">
                        <small class="text-muted">
                            <i class="bi bi-info-circle me-1"></i>
                            Default admin: <code>admin</code> / <code>admin123</code>
                        </small>
                    </div>
                </div>

                <!-- Register Tab -->
                <div class="tab-pane fade" id="register" role="tabpanel" aria-labelledby="register-tab">
                    <div id="register-alert" class="alert alert-danger d-none" role="alert">
                        <i class="bi bi-exclamation-triangle me-2"></i>
                        <span id="register-error-message"></span>
                    </div>
                    
                    <form id="registerForm">
                        <div class="form-floating">
                            <input type="text" class="form-control" id="register-username" placeholder="Username" required pattern="[a-zA-Z0-9_]{3,}" title="Username must be at least 3 characters (letters, numbers, underscore)">
                            <label for="register-username"><i class="bi bi-person me-2"></i>Username</label>
                        </div>
                        
                        <div class="form-floating">
                            <input type="text" class="form-control" id="register-fullname" placeholder="Full Name">
                            <label for="register-fullname"><i class="bi bi-person-badge me-2"></i>Full Name (Optional)</label>
                        </div>
                        
                        <div class="form-floating">
                            <input type="password" class="form-control" id="register-password" placeholder="Password" required minlength="8">
                            <label for="register-password"><i class="bi bi-lock me-2"></i>Password</label>
                        </div>
                        
                        <div class="form-floating">
                            <input type="password" class="form-control" id="register-confirm-password" placeholder="Confirm Password" required minlength="8">
                            <label for="register-confirm-password"><i class="bi bi-lock-fill me-2"></i>Confirm Password</label>
                        </div>
                        
                        <div class="password-requirements">
                            <i class="bi bi-info-circle me-1"></i> Password must be at least 8 characters long
                        </div>
                        
                        <button type="submit" class="btn btn-primary mt-3" id="registerBtn">
                            <span class="btn-text">Create Account</span>
                            <span class="spinner-border spinner-border-sm d-none" role="status"></span>
                        </button>
                    </form>
                </div>
            </div>
            
            <div class="text-center mt-4">
                <small class="text-muted">Medaudit 2.0 - Medical Device Security Platform</small>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Login form handler
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const submitBtn = document.getElementById('loginBtn');
            const btnText = submitBtn.querySelector('.btn-text');
            const spinner = submitBtn.querySelector('.spinner-border');
            const errorAlert = document.getElementById('login-alert');
            const errorMessage = document.getElementById('login-error-message');
            
            // Show loading
            btnText.textContent = 'Signing in...';
            spinner.classList.remove('d-none');
            submitBtn.disabled = true;
            errorAlert.classList.add('d-none');
            
            try {
                const username = document.getElementById('login-username').value;
                const password = document.getElementById('login-password').value;
                
                console.log('Attempting login for:', username);
                
                const response = await fetch('/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                console.log('Response status:', response.status);
                
                const data = await response.json();
                console.log('Response data:', data);
                
                if (response.ok && data.success) {
                    console.log('Login successful, redirecting to:', data.redirect || '/dashboard');
                    // Force redirect with window.location.replace for better compatibility
                    window.location.replace(data.redirect || '/dashboard');
                } else {
                    throw new Error(data.detail || 'Login failed');
                }
            } catch (error) {
                console.error('Login error:', error);
                errorMessage.textContent = error.message || 'An error occurred';
                errorAlert.classList.remove('d-none');
                btnText.textContent = 'Sign In';
                spinner.classList.add('d-none');
                submitBtn.disabled = false;
            }
        });

        // Register form handler
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const submitBtn = document.getElementById('registerBtn');
            const btnText = submitBtn.querySelector('.btn-text');
            const spinner = submitBtn.querySelector('.spinner-border');
            const errorAlert = document.getElementById('register-alert');
            const errorMessage = document.getElementById('register-error-message');
            
            const username = document.getElementById('register-username').value;
            const fullName = document.getElementById('register-fullname').value;
            const password = document.getElementById('register-password').value;
            const confirmPassword = document.getElementById('register-confirm-password').value;

            // Validate passwords match
            if (password !== confirmPassword) {
                errorMessage.textContent = 'Passwords do not match';
                errorAlert.classList.remove('d-none');
                return;
            }

            // Validate password length
            if (password.length < 8) {
                errorMessage.textContent = 'Password must be at least 8 characters long';
                errorAlert.classList.remove('d-none');
                return;
            }
            
            // Show loading
            btnText.textContent = 'Creating account...';
            spinner.classList.remove('d-none');
            submitBtn.disabled = true;
            errorAlert.classList.add('d-none');
            
            try {
                console.log('Attempting registration for:', username);
                
                const response = await fetch('/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        username,
                        password,
                        full_name: fullName || null
                    })
                });
                
                console.log('Response status:', response.status);
                
                const data = await response.json();
                console.log('Response data:', data);
                
                if (response.ok && data.success) {
                    console.log('Registration successful, redirecting to:', data.redirect || '/dashboard');
                    window.location.replace(data.redirect || '/dashboard');
                } else {
                    throw new Error(data.detail || 'Registration failed');
                }
            } catch (error) {
                console.error('Registration error:', error);
                errorMessage.textContent = error.message || 'An error occurred';
                errorAlert.classList.remove('d-none');
                btnText.textContent = 'Create Account';
                spinner.classList.add('d-none');
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
